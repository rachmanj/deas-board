services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: board-app:latest
    container_name: board-app
    restart: unless-stopped
    ports:
      - "3010:80"
    volumes:
      - ./env:/var/www/.env:ro
      - board_storage:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/login || wget -q -O- http://127.0.0.1/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - board

  mysql:
    image: mysql:8.0
    container_name: board-mysql
    restart: unless-stopped
    # Rahasia TIDAK disimpan di berkas ini; isi lewat env.compose dan jalankan lewat ./dc
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD belum diisi}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-board}
      MYSQL_USER: ${MYSQL_USER:-board}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD belum diisi}
    volumes:
      - board_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - board

volumes:
  board_storage:
  board_mysql:

networks:
  board:
    driver: bridge
